name: Train taxi model

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Unit tests
        run: uv run pytest

  train:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure DVC remote
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user "$DAGSHUB_USER"
          uv run dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          uv run dvc remote modify origin --local read_timeout 300

      - name: Pull data
        run: uv run dvc pull -v

      - name: Train model
        shell: bash
        run: |
          uv run python src/train.py | tee train.log
          echo "## Training metrics" > report.md
          grep "RMSE" train.log >> report.md

      - name: Post metrics on PR
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create report.md

      - name: Check RMSE quality gate
        shell: bash
        run: |
          rmse=$(grep '^RMSE:' train.log | awk '{print $2}' || true)
          limit=5.5
          echo "RMSE: $rmse (limit: $limit)"
          if [ -z "$rmse" ]; then echo "::error::No RMSE found in train.log"; exit 1; fi
          awk -v r="$rmse" -v l="$limit" 'BEGIN { exit !(r <= l) }' || { echo "::error::RMSE $rmse is above the limit $limit"; exit 1; }

      - name: Upload MLflow run and model
        uses: actions/upload-artifact@v4
        with:
          name: training-output
          path: |
            mlflow.db
            mlruns/
            models/model.skops