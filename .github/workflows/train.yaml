name: Train taxi model

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure DVC remote
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user "$DAGSHUB_USER"
          uv run dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      - name: Pull data
        run: uv run dvc pull -v

      - name: Train model
        shell: bash
        run: |
          echo "## Training metrics" > report.md
          uv run python src/train.py | tee -a report.md

      - name: Post metrics on PR
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create report.md

      - name: Upload MLflow run and model
        uses: actions/upload-artifact@v4
        with:
          name: training-output
          path: |
            mlflow.db
            mlruns/
            models/model.skops