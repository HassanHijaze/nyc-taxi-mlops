services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - 5000:5000
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EVIDENTLY_URL: http://evidently:8001
    ports:
      - 8000:8000
    depends_on:
      - mlflow
      - evidently

  evidently:
    build: .
    command: uvicorn src.monitor:app --host 0.0.0.0 --port 8001
    volumes:
      - ./data/reference.parquet:/app/data/reference.parquet:ro
      - ./reports:/app/reports
    ports:
      - 8001:8001

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:12.0.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 3000:3000
    depends_on:
      - prometheus

volumes:
  mlflow-data: